# SPDX-License-Identifier: Apache-2.0
name: build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04

    # Fedora rather than the runner's own image, because this project is C++23 in
    # earnest -- std::expected, std::print, std::views::chunk -- and Ubuntu
    # 24.04's clang 18 and libstdc++ 13 do not have it. This also matches the
    # machine the project is developed on, so a CI failure means something.
    container: fedora:43

    strategy:
      fail-fast: false
      matrix:
        # Two compilers and two standard libraries, plus the sanitisers. The
        # strict gate is the point of this project, so CI runs the same presets a
        # person runs rather than a relaxed variant of them.
        preset: [gcc-release, clang-debug, clang-asan-ubsan, clang-tsan]

    steps:
      - name: Install toolchain and Qt
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build git \
            gcc-c++ clang clang-tools-extra compiler-rt \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            systemd-devel libusb1-devel

      - uses: actions/checkout@v4

      # hidapi and Catch2 are fetched by CPM. Caching keeps a run from depending
      # on two upstream repositories staying reachable.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-

      - name: Configure
        env:
          CPM_SOURCE_CACHE: /root/.cache/CPM
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Nothing here needs an AX310 attached, a display, or a GPU. The driver
      # tests run against FakeHidTransport; the rendering tests drive real QML
      # through the software scene graph, with the offscreen platform set by the
      # test binary itself.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-logs
          path: out/build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore
