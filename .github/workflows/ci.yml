# SPDX-License-Identifier: Apache-2.0
name: build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04

    # Fedora rather than the runner's own image, because this project is C++23 in
    # earnest -- std::expected, std::print, std::views::chunk -- and Ubuntu
    # 24.04's clang 18 and libstdc++ 13 do not have it. This also matches the
    # machine the project is developed on, so a CI failure means something.
    container: fedora:43

    strategy:
      fail-fast: false
      matrix:
        # Two compilers and two standard libraries, plus the sanitisers. The
        # strict gate is the point of this project, so CI runs the same presets a
        # person runs rather than a relaxed variant of them.
        preset: [gcc-release, clang-debug, clang-asan-ubsan, clang-tsan]

    steps:
      - name: Install toolchain and Qt
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build git \
            gcc-c++ clang clang-tools-extra compiler-rt \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            systemd-devel libusb1-devel

      - uses: actions/checkout@v4

      # hidapi and Catch2 are fetched by CPM. Caching keeps a run from depending
      # on two upstream repositories staying reachable.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-

      - name: Configure
        env:
          CPM_SOURCE_CACHE: /root/.cache/CPM
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Nothing here needs an AX310 attached, a display, or a GPU. The driver
      # tests run against FakeHidTransport; the rendering tests drive real QML
      # through the software scene graph, with the offscreen platform set by the
      # test binary itself.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-logs
          path: out/build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore

  # Windows builds the driver, the tools and the tests -- not because the deck is
  # supported there, but because the driver is deliberately Qt-free and
  # platform-free and this is what checks that claim. hidapi has a Windows
  # backend, `hidapi::hidapi` aliases to whichever backend the platform has, and
  # nothing first-party includes a POSIX header. If any of that stops being true,
  # this job is where it shows up rather than the first time somebody tries.
  #
  # It is not a support promise. The audio routing is PipeWire, the device
  # permissions are udev, and neither exists here -- the install rules for both
  # are guarded to Linux in cmake/Packaging.cmake.
  windows:
    name: ${{ matrix.preset }} (windows)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        preset: [cl-release]

    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe, the Windows SDK and Ninja on PATH. The presets use the Ninja
      # generator on every platform, so without this the configure has no compiler
      # to find.
      - uses: ilammy/msvc-dev-cmd@v1

      # qtdeclarative is not in the default install; the interface is QML and the
      # rendering tests drive it, so it is not optional.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools'
          cache: true

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-windows-

      # install-qt-action sets QT_ROOT_DIR but does not put Qt's bin on PATH, and
      # catch_discover_tests runs the test binary during the build to enumerate
      # its cases. DL_PATHS covers that run; this covers everything else that
      # might want a Qt DLL, including the diagnostic step below.
      - name: Put Qt on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:QT_ROOT_DIR\bin"

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ~/.cache/CPM
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # A DLL that cannot be found makes a binary exit 0xc0000135 with no output
      # and nothing naming what is missing, so the build error is unreadable on
      # its own. This says which import is unresolved.
      - name: Name the missing DLL, if there is one
        if: failure()
        shell: pwsh
        run: |
          $exe = "out/build/${{ matrix.preset }}/src/ax310_gui_test.exe"
          if (-not (Test-Path $exe)) { Write-Host "no binary to inspect"; exit 0 }
          Write-Host "--- direct run:"
          & $exe --list-tests 2>&1 | Select-Object -First 5
          Write-Host "--- exit code: $LASTEXITCODE"
          Write-Host "--- declared imports:"
          dumpbin /dependents $exe | Select-String -Pattern "\.dll"
          Write-Host "--- what is actually in Qt's bin:"
          Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter "Qt6*.dll" | Select-Object -ExpandProperty Name

      # Same as on Linux: no deck, no display, no GPU. The native-backend
      # rendering test skips itself here, because it is gated on a Wayland or X11
      # session and this is neither.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-windows-logs
          path: out/build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore
