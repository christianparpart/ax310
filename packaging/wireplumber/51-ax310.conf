# AVerMedia Live Streamer AX310: hold the Pro Audio profile, and give the raw
# nodes names that do not carry the serial number.
#
# Two problems, both of which stand between this device working and a package
# being able to ship a fixed configuration for it.
#
# The deck presents one six-channel playback device and one eight-channel capture
# device. PipeWire's default profile maps those onto a surround layout, which
# hides the six mixer tracks and wastes half the channels -- every application
# ends up in the same place and the six knobs control six copies of one thing.
# Pro Audio exposes the raw channels instead. WirePlumber remembers a profile
# chosen by hand, but a fresh install has nothing to remember, so this states the
# preference.
#
# And the node names are built from the ALSA card id, which carries the serial:
#   alsa_output.usb-AVerMedia_Live_Streamer_AX310_5311291500056-00.pro-output-0
# A configuration naming that is correct on exactly one machine. Renamed here,
# the loopback fragment that splits the channels is the same file everywhere.
#
# Matched on the USB vendor and product ids rather than the card name, because
# those are what the deck actually is: 07ca:0310 is the audio interface -- the
# control interface it also presents is 07ca:1310 and has no ALSA card at all.

# Only consulted when nothing is stored: WirePlumber's find-stored-profile hook
# runs first and wins, so a profile somebody chose by hand is left alone.
device.profile.priority.rules = [
  {
    matches = [
      {
        device.vendor.id  = "0x07ca"
        device.product.id = "0x0310"
      }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]

# The node rules match on the card name, because a node does not inherit the USB
# ids -- and on the profile, so that the fixed names exist only when they mean
# what the split fragment expects. Under any other profile the deck keeps its
# generated names and the loopbacks simply find no target, which is a cleaner
# failure than half a device.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name  = "Live Streamer AX310"
        api.alsa.pcm.stream = "playback"
        device.profile.name = "~pro-.*"
      }
    ]
    actions = {
      update-props = {
        node.name = "ax310_raw_out"
      }
    }
  },
  {
    matches = [
      {
        api.alsa.card.name  = "Live Streamer AX310"
        api.alsa.pcm.stream = "capture"
        device.profile.name = "~pro-.*"
      }
    ]
    actions = {
      update-props = {
        node.name = "ax310_raw_in"
      }
    }
  }
]
